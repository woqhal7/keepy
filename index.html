<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f1e7"><title>KEEPY · 나만의 저축방</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#4b392f;background:#f8f0e6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid #8aaa7e;outline-offset:2px}.app{width:min(480px,100%);margin:auto;padding:17px 16px 110px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:5px 3px 12px}.logo{font-size:28px;font-weight:900;letter-spacing:-1.5px;color:#734b39}.chip{padding:10px 13px;border-radius:30px;background:#fff8f1;color:#7e6556;font-size:12px}.screen{display:none}.screen.active{display:block}.card{background:#fffaf4;border-radius:22px;padding:17px;box-shadow:0 7px 22px #89644613}.headline{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.headline small{color:#9a8274;font-size:12px}.headline strong{font-size:22px;color:#d97f82}.room{position:relative;height:420px;overflow:hidden;border-radius:25px 25px 0 0;isolation:isolate;background:#f6dfc6;box-shadow:0 14px 26px #805b3d20}.room-art{position:absolute;inset:0;width:100%;height:100%}.sunbeam{position:absolute;inset:0;background:linear-gradient(110deg,#fff9d87c,transparent 50%);pointer-events:none}.pig{position:absolute;z-index:5;left:50%;bottom:45px;transform:translateX(-50%);height:225px;max-width:55%;object-fit:contain;filter:drop-shadow(0 12px 10px #835c4d59)}.rug{position:absolute;z-index:2;left:46%;top:82%;width:69%;height:75px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#fffdf5 30%,#f1dfc9 80%);border:7px solid #fff4e6;box-shadow:0 8px 13px #6b503a3a}.decor{position:absolute;z-index:6;touch-action:none;user-select:none;cursor:grab}.decor.dragging{cursor:grabbing}.plant{width:98px;height:160px;left:79%;top:70%;transform:translate(-50%,-50%);filter:drop-shadow(4px 8px 5px #674a3c33)}.lamp{width:94px;height:138px;left:17%;top:73%;transform:translate(-50%,-50%);filter:drop-shadow(4px 8px 5px #674a3c33)}.decor svg{width:100%;height:100%}.decor.off{display:none}.talk{position:absolute;z-index:7;top:24px;left:41%;max-width:48%;padding:12px 15px;border-radius:19px;background:#fffaf1ee;color:#785341;font-size:13px;font-weight:750;line-height:1.5;text-align:center;box-shadow:0 4px 16px #7a54301f}.room-note{position:absolute;z-index:8;left:12px;bottom:9px;font-size:10px;color:#785b48;background:#fff9efc9;padding:6px 9px;border-radius:20px}.tools{position:absolute;z-index:9;right:9px;top:106px;display:grid;gap:6px;padding:6px;background:#fffaf1db;border-radius:17px}.tool{width:39px;height:39px;border-radius:12px;background:white;font-size:20px}.tool.off{opacity:.42}.budget{background:#fffaf4;padding:18px;border-radius:0 0 24px 24px;box-shadow:0 12px 25px #89644613}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.between strong{font-size:19px}.muted{font-size:12px;color:#98857a;line-height:1.5}.progress{height:11px;background:#ede3d9;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#9cbb86;border-radius:20px;transition:width .25s}.month{margin:10px 0 12px;padding:14px 17px;background:#fffaf4;border-radius:18px}.month .progress{height:6px}.month .fill{background:#d6b7a0}.event{margin-top:12px;background:#fff0ce;border-radius:20px;padding:17px}.event p{margin:7px 0 12px}.primary,.secondary{display:block;width:100%;padding:13px 14px;border-radius:14px;font-weight:800}.primary{background:#e78f93;color:#fff}.secondary{background:#efe6de;color:#674c40;margin-top:8px}.primary:active,.secondary:active,.quick:active{transform:scale(.98)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:12px}.quick{text-align:left;min-height:112px}.quick b{font-size:15px}.quick small{display:block;color:#a18b7e;margin:10px 0 5px;font-size:11px}.quick strong{font-size:13px}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf9;border-radius:22px 22px 0 0;box-shadow:0 -4px 20px #805a391b;padding:9px 5px max(10px,env(safe-area-inset-bottom))}.nav button{background:none;color:#7d7069;font-size:10px;font-weight:800;line-height:1.5}.nav button.on{color:#d87680}.nav .plus{background:#e99599;color:white;border-radius:50%;width:49px;height:49px;margin:auto;font-size:27px}.title{font-size:25px;margin:17px 0;font-weight:900}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:11px;color:#a28c7e;padding:10px 0}.day{border-radius:11px;background:#fff6ed;min-height:54px;font-size:12px}.day span{display:block;margin-top:5px}.day.has{background:#fce4d6}.day.today{outline:2px solid #e8a2a2}.day.empty{background:none;cursor:default}.goal-value{font-size:25px;font-weight:900;margin-top:13px}.modal{display:none;position:fixed;inset:0;z-index:40;background:#24180e80;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{position:relative;background:#fffaf4;border-radius:26px 26px 0 0;padding:25px 20px max(30px,env(safe-area-inset-bottom));width:min(480px,100%);max-height:86vh;overflow:auto}.sheet h2{margin:3px 42px 15px 0;font-size:22px}.close{position:absolute;top:17px;right:18px;width:36px;height:36px;border-radius:50%;background:#f0e7dd}.input{width:100%;padding:13px;border:1px solid #e5d8c9;border-radius:12px;background:#fff;margin:7px 0 13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee2d7}.row span{min-width:0}.row button{flex-shrink:0}.empty{text-align:center;color:#a18b7d;padding:22px 0}.label{font-size:12px;font-weight:700;color:#846e60}.stat{padding:13px;background:#f8eee4;border-radius:15px;margin:9px 0}.stat strong{display:block;font-size:21px;margin-top:4px}.collection{display:grid;grid-template-columns:1fr 1fr;gap:10px}.collection button{min-height:92px;background:#fff;border-radius:17px;font-weight:800}.hint{font-size:11px;color:#a28a7c}.space{height:10px}@media(max-width:375px){.room{height:380px}.pig{height:205px}.plant{width:83px;height:143px}.lamp{width:80px;height:125px}.talk{font-size:11px;padding:9px}.quick{min-height:118px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="app">

 r="6" fill="#53483f"/><rect x="195" y="151" width="10" height="17" rx="2" fill="#9b9b83"/></svg><div class="sunbeam"></div><div class="rug decor" data-decor="rug"></div><div class="plant decor" data-decor="plant"><svg viewBox="0 0 100 160" aria-hidden="true"><ellipse cx="50" cy="149" rx="35" ry="9" fill="#684d3a" opacity=".25"/><path d="M22 111h56l-9 39H31z" fill="#bb7b51"/><ellipse cx="50" cy="111" rx="28" ry="8" fill="#dc9a6e"/><path d="M50 112V26M50 100L21 59M50 84L81 36" stroke="#4b7e4c" stroke-width="4" fill="none"/><g fill="#528a59" stroke="#3f7448" stroke-width="2"><path d="M49 59C8 55 1 24 21 12c21-10 33 20 28 47z"/><path d="M52 62c3-40 29-57 43-34 12 20-15 39-43 34z"/><path d="M43 96C2 100 1 75 17 61c19-13 29 13 26 35z"/><path d="M57 103c-3-34 17-50 34-34 17 17-5 38-34 34z"/></g></svg></div><div class="lamp decor" data-decor="lamp"><svg viewBox="0 0 110 150" aria-hidden="true"><ellipse cx="55" cy="143" rx="46" ry="7" fill="#775540" opacity=".23"/><path d="M21 107h72v34H21z" fill="#c38e61"/><rect x="24" y="102" width="65" height="10" rx="5" fill="#d7a87a"/><path d="M55 96V46" stroke="#997456" stroke-width="7"/><path d="M32 20h46l18 48H15z" fill="#fff0c5" stroke="#e8d3ab" stroke-width="3"/><ellipse cx="55" cy="68" rx="40" ry="7" fill="#f5dba9"/></svg></div><img class="pig" src="./keepy_pig.png" alt="새싹이 자란 분홍색 돼지 KEEPY"><div class="talk" id="roomTalk">이번 주도<br>잘 해보자! 🌱</div><div class="room-note">가구를 드래그해서 옮겨 봐 ✨</div><div class="tools"><button class="tool" data-item="plant" aria-label="화분 배치">🪴</button><button class="tool" data-item="lamp" aria-label="조명 배치">💡</button><button class="tool" data-item="rug" aria-label="러그 배치">🧶</button></div></div>
<div class="budget"><div class="between"><b>이번 주 예산</b><strong id="weekBudget">₩140,000</strong></div><div class="progress"><div class="fill" id="weekBar"></div></div><div class="between"><span>남은 금액</span><strong id="weekLeft">₩140,000</strong></div><p class="muted" id="weekUsed"></p></div><div class="month"><div class="between"><small>이번 달 남은 예산</small><b id="monthLeft"></b></div><div class="progress"><div class="fill" id="monthBar"></div></div><small class="muted" id="monthUsed"></small></div><div class="event"><b>🐷 일요일 정산</b><p class="muted">남은 예산을 TOKYO에 저축하거나 다음 주로 이월해 봐.</p><button class="primary" id="settle">이번 주 정산하기</button></div><div class="grid"><button class="card quick" data-more="wait"><b>🛍️ WAIT LIST</b><small>72시간 고민하기</small><strong id="waitQuick">0개 대기 중</strong></button><button class="card quick" data-more="pay"><b>💵 PAYDAY</b><small>월급날 체크리스트</small><strong id="payQuick">0 / 3 완료</strong></button><button class="card quick" data-more="collect"><b>🎁 COLLECTION</b><small>내 방의 아이템</small><strong id="collectQuick">3개 획득</strong></button><button class="card quick" data-more="report"><b>📊 REPORT</b><small>이번 달 지출</small><strong id="reportQuick">₩0</strong></button></div></section>
<section class="screen" id="calendar"><h1 class="title">Mood Calendar 📅</h1><div class="card"><div class="between"><button class="chip" id="prevMonth" aria-label="이전 달">‹</button><b id="calendarMonth"></b><button class="chip" id="nextMonth" aria-label="다음 달">›</button></div><div id="calendarDays" class="calendar"></div></div><p class="muted">날짜를 누르면 지출 내역을 볼 수 있어.</p></section>
<section class="screen" id="goals"><h1 class="title">Goals 🎯</h1><div class="card"><b>✈️ TOKYO</b><div class="goal-value" id="goalValue"></div><div class="progress"><div class="fill" id="goalBar"></div></div><p class="muted" id="goalMeta"></p><button class="primary" id="goalAdd">목표에 저축 기록하기</button></div><div class="card" style="margin-top:12px"><b>🎁 다음 보상</b><p id="reward" class="muted"></p></div></section>
<section class="screen" id="more"><h1 class="title">More 🌷</h1><div class="grid"><button class="card quick" data-more="wait">🛍️ WAIT LIST</button><button class="card quick" data-more="pay">💵 PAYDAY</button><button class="card quick" data-more="collect">🎁 COLLECTION</button><button class="card quick" data-more="report">📊 REPORT</button></div><p class="muted">기록은 현재 브라우저에 저장돼. 다른 기기와 자동으로 동기화되지는 않아.</p></section>
</main><nav class="nav" aria-label="하단 메뉴"><button class="on" data-nav="home">🐷<br>HOME</button><button data-nav="calendar">📅<br>CALENDAR</button><button class="plus" id="plus" aria-label="지출 추가">＋</button><button data-nav="goals">🎯<br>GOALS</button><button data-nav="more">•••<br>MORE</button></nav><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="KEEPY 상세 화면"><div class="sheet"><button class="close" id="close" aria-label="닫기">×</button><div id="modalBody"></div></div></div>
<script>
"use strict";
const KEY="keepy-v2", WEEK=140000, MONTH=600000, TARGET=3000000, H72=72*60*60*1000;
const defaults=()=>({version:2,weekBudget:WEEK,monthBudget:MONTH,weekSpent:0,monthSpent:0,saved:0,goal:0,rollover:0,lastSettlement:"",pay:[false,false,false],placed:{plant:true,lamp:true,rug:true},decorPositions:{},waitItems:[],expenses:[],settlements:[],goalEntries:[]});
const $=id=>document.getElementById(id),won=n=>"₩"+Math.round(n||0).toLocaleString("ko-KR"),dateKey=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
const esc=v=>String(v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||"null");if(!raw||raw.version!==2)return defaults();const d=defaults();return {...d,...raw,pay:Array.isArray(raw.pay)?raw.pay:d.pay,placed:{...d.placed,...raw.placed},decorPositions:raw.decorPositions||{},waitItems:Array.isArray(raw.waitItems)?raw.waitItems:[],expenses:Array.isArray(raw.expenses)?raw.expenses:[],settlements:Array.isArray(raw.settlements)?raw.settlements:[],goalEntries:Array.isArray(raw.goalEntries)?raw.goalEntries:[]}}catch{return defaults()}}
let s=load(),shownMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{alert("저장 공간이 부족해. 브라우저 설정을 확인해 줘.")}render()}
function modal(html){$("modalBody").innerHTML=html;$("modal").classList.add("on")}
function shut(){$("modal").classList.remove("on")}
function safeAmount(v){const n=Number(String(v).replace(/[^0-9]/g,""));return Number.isSafeInteger(n)&&n>0&&n<=100000000?n:0}
function render(){
 const weekTotal=s.weekBudget+s.rollover,remaining=weekTotal-s.weekSpent,monthRemaining=s.monthBudget-s.monthSpent;
 $("saved").textContent=won(s.saved);$("weekBudget").textContent=won(weekTotal);$("weekLeft").textContent=won(Math.max(0,remaining));$("weekUsed").textContent=won(s.weekSpent)+" 사용"+(remaining<0?" · "+won(-remaining)+" 초과":"");
 $("weekBar").style.width=Math.max(0,Math.min(100,remaining/Math.max(1,weekTotal)*100))+"%";$("monthLeft").textContent=won(Math.max(0,monthRemaining));$("monthUsed").textContent=won(s.monthSpent)+" 사용";$("monthBar").style.width=Math.min(100,s.monthSpent/s.monthBudget*100)+"%";
 $("goalValue").textContent=won(s.goal)+" / "+won(TARGET);$("goalBar").style.width=Math.min(100,s.goal/TARGET*100)+"%";$("goalMeta").textContent=Math.floor(s.goal/TARGET*100)+"% 달성 · "+won(Math.max(0,TARGET-s.goal))+" 남음";$("reward").textContent=s.goal>=1800000?"✨ Cozy Chair 보상 달성!":won(Math.max(0,1800000-s.goal))+" 더 모으면 Cozy Chair";
 $("waitQuick").textContent=s.waitItems.filter(x=>x.status==="waiting").length+"개 대기 중";$("payQuick").textContent=s.pay.filter(Boolean).length+" / 3 완료";$("collectQuick").textContent=(3+(s.goal>=1800000?1:0))+"개 획득";$("reportQuick").textContent=won(s.expenses.filter(x=>x.date.startsWith(dateKey().slice(0,7))).reduce((n,x)=>n+x.amount,0));
 $("roomTalk").innerHTML=remaining<0?"조금 쉬어가도 괜찮아 🌱":"이번 주도<br>잘 해보자! 🌱";$("settle").textContent=new Date().getDay()===0?"이번 주 정산하기":"일요일에 정산할 수 있어";
 document.querySelectorAll("[data-decor]").forEach(el=>{const k=el.dataset.decor;el.classList.toggle("off",!s.placed[k]);const p=s.decorPositions[k];if(p){el.style.left=p.x+"%";el.style.top=p.y+"%";el.style.transform="translate(-50%,-50%)"}});
 document.querySelectorAll(".tool").forEach(el=>el.classList.toggle("off",!s.placed[el.dataset.item]));renderCalendar()
}
function navigate(id){document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===id));document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("on",x.dataset.nav===id));if(id==="calendar")renderCalendar();window.scrollTo({top:0,behavior:"instant"})}
function renderCalendar(){const y=shownMonth.getFullYear(),m=shownMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$("calendarMonth").textContent=y+"년 "+(m+1)+"월";const totals={};s.expenses.forEach(x=>totals[x.date]=(totals[x.date]||0)+x.amount);$("calendarDays").innerHTML=["일","월","화","수","목","금","토"].map(x=>'<div class="weekday">'+x+"</div>").join("")+Array.from({length:first},()=>'<span class="day empty"></span>').join("")+Array.from({length:days},(_,i)=>{const d=dateKey(new Date(y,m,i+1)),v=totals[d]||0;return '<button class="day '+(v?"has ":"")+(d===dateKey()?"today":"")+'" data-date="'+d+'">'+(i+1)+"<span>"+(v?"🪙":"·")+"</span></button>"}).join("")}
function openWait(){const list=s.waitItems.filter(x=>x.status==="waiting");modal("<h2>WAIT LIST 🛍️</h2><p class='muted'>72시간 동안 기다린 뒤 구매할지 결정해 봐.</p>"+(list.length?list.map(x=>{const left=H72-(Date.now()-x.createdAt),ready=left<=0;return '<div class="card" style="margin:9px 0"><b>'+esc(x.name)+'</b><div class="row"><span>'+won(x.amount)+'</span><small class="muted">'+(ready?"결정 가능 ✓":Math.ceil(left/3600000)+"시간 남음")+'</small></div>'+(ready?'<button class="primary" data-wait-decision="no" data-id="'+x.id+'">안 살래! 돈 지키기</button><button class="secondary" data-wait-decision="yes" data-id="'+x.id+'">구매하기</button>':'<p class="muted">조금 더 기다려 보자 🌱</p>')+'</div>'}).join(""):'<p class="empty">기다리는 물건이 없어 🌱</p>')+'<button class="secondary" id="addWait">＋ 물건 추가</button>')}
function openPay(){const names=["경조사 통장 · ₩100,000","고정비 통장 · ₩600,000","여행저축 · ₩200,000"];modal("<h2>PAYDAY 💵</h2><p class='muted'>월급날 배분을 완료했으면 체크해 줘.</p>"+names.map((x,i)=>'<div class="row"><span>'+x+'</span><button class="chip" data-pay="'+i+'">'+(s.pay[i]?"✓ 완료":"체크")+"</button></div>").join(""))}
function openCollection(){modal("<h2>COLLECTION 🎁</h2><p class='muted'>아이템을 누르면 방에 넣거나 뺄 수 있어.</p><div class='collection'>"+[["plant","🪴 Monstera"],["lamp","💡 Cozy Lamp"],["rug","🧶 Soft Rug"]].map(([k,v])=>'<button data-place="'+k+'">'+v+'<small style="display:block">'+(s.placed[k]?"방에서 빼기":"방에 놓기")+"</small></button>").join("")+(s.goal>=1800000?"<div class='card'>🪑 Cozy Chair 획득</div>":"")+"</div>")}
function openReport(){const month=dateKey().slice(0,7),items=s.expenses.filter(x=>x.date.startsWith(month)),total=items.reduce((a,x)=>a+x.amount,0),cats={};items.forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);modal("<h2>REPORT 📊</h2><div class='stat'>이번 달 기록된 지출<strong>"+won(total)+"</strong></div><div class='stat'>구매하지 않고 지킨 금액 (누적)<strong>"+won(s.saved)+"</strong></div><div class='stat'>TOKYO 목표 저축 (누적)<strong>"+won(s.goal)+"</strong></div><div class='stat'>이번 달 예산 잔액<strong>"+won(Math.max(0,s.monthBudget-s.monthSpent))+"</strong></div><h3>카테고리별 지출</h3>"+(Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="row"><span>'+esc(k)+'</span><b>'+won(v)+"</b></div>").join(""):"<p class='empty'>이번 달 기록된 지출이 없어</p>")+"<p class='hint'>예산 및 목표 금액은 직접 기록한 값이며 실제 은행 잔액과 연결되지 않아.</p>")}
const views={wait:openWait,pay:openPay,collect:openCollection,report:openReport};
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.nav)));
document.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",()=>views[b.dataset.more]()));
$("plus").onclick=()=>modal('<h2>지출 기록하기</h2><label class="label" for="amount">금액 (원)</label><input class="input" id="amount" inputmode="numeric" placeholder="예: 12000"><label class="label" for="category">카테고리</label><select class="input" id="category"><option>식비</option><option>카페</option><option>쇼핑</option><option>교통</option><option>생활</option><option>기타</option></select><button class="primary" id="saveExpense">기록하기</button>');
$("goalAdd").onclick=()=>modal('<h2>TOKYO 저축 기록</h2><p class="muted">실제로 저축한 금액만 입력해 줘.</p><input class="input" id="goalAmount" inputmode="numeric" placeholder="저축 금액 (원)"><button class="primary" id="saveGoal">저축 기록하기</button>');
$("settle").onclick=()=>{if(new Date().getDay()!==0){modal("<h2>일요일 정산 🌱</h2><p>정산은 일요일에 할 수 있어.</p>");return}if(s.lastSettlement===dateKey()){modal("<h2>이번 주 정산 완료 ✓</h2>");return}const left=Math.max(0,s.weekBudget+s.rollover-s.weekSpent);modal("<h2>이번 주 "+won(left)+" 남았어! 🎉</h2><p class='muted'>저축을 선택하면 목표 저축 기록에 반영돼. 실제 이체는 직접 해야 해.</p><button class='primary' data-settle='goal'>🎯 전부 TOKYO 저축</button><button class='secondary' data-settle='carry'>➡️ 다음 주로 이월</button><button class='secondary' data-settle='split'>✂️ 반반 나누기</button>")};
$("reset").onclick=()=>{if(confirm("저장한 KEEPY 기록을 모두 초기화할까? 복구할 수 없어.")){s=defaults();save();navigate("home")}};
$("close").onclick=shut;$("modal").onclick=e=>{if(e.target===$("modal"))shut()};document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
$("prevMonth").onclick=()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()-1,1);renderCalendar()};$("nextMonth").onclick=()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()+1,1);renderCalendar()};
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.item){const k=b.dataset.item;s.placed[k]=!s.placed[k];save();return}
 if(b.dataset.place){const k=b.dataset.place;s.placed[k]=!s.placed[k];save();openCollection();return}
 if(b.dataset.pay!==undefined){const i=Number(b.dataset.pay);s.pay[i]=!s.pay[i];save();openPay();return}
 if(b.dataset.date){const items=s.expenses.filter(x=>x.date===b.dataset.date);modal("<h2>"+b.dataset.date+" 지출</h2>"+(items.length?items.map(x=>'<div class="row"><span>'+esc(x.category)+'</span><b>'+won(x.amount)+"</b></div>").join("")+"<div class='stat'>합계<strong>"+won(items.reduce((a,x)=>a+x.amount,0))+"</strong></div>":"<p class='empty'>이날 기록한 지출이 없어</p>"));return}
 if(b.id==="saveExpense"){const n=safeAmount($("amount").value);if(!n){alert("올바른 금액을 입력해 줘.");return}s.weekSpent+=n;s.monthSpent+=n;s.expenses.push({id:Date.now(),amount:n,category:$("category").value,date:dateKey()});save();shut();return}
 if(b.id==="saveGoal"){const n=safeAmount($("goalAmount").value);if(!n){alert("올바른 금액을 입력해 줘.");return}s.goal=Math.min(TARGET,s.goal+n);s.goalEntries.push({amount:n,date:dateKey(),source:"manual"});save();shut();return}
 if(b.id==="addWait"){modal('<h2>WAIT LIST에 추가</h2><label class="label">물건 이름</label><input class="input" id="waitName" maxlength="60" placeholder="예: 운동화"><label class="label">가격 (원)</label><input class="input" id="waitAmount" inputmode="numeric" placeholder="예: 129000"><button class="primary" id="saveWait">72시간 기다리기</button>');return}
 if(b.id==="saveWait"){const name=$("waitName").value.trim(),amount=safeAmount($("waitAmount").value);if(!name||!amount){alert("물건 이름과 올바른 가격을 입력해 줘.");return}s.waitItems.push({id:String(Date.now())+"-"+Math.random().toString(36).slice(2,7),name,amount,createdAt:Date.now(),status:"waiting"});save();openWait();return}
 if(b.dataset.waitDecision){const x=s.waitItems.find(v=>v.id===b.dataset.id);if(!x||x.status!=="waiting"||Date.now()-x.createdAt<H72)return;x.status=b.dataset.waitDecision==="no"?"saved":"bought";if(x.status==="saved")s.saved+=x.amount;else{s.weekSpent+=x.amount;s.monthSpent+=x.amount;s.expenses.push({id:Date.now(),amount:x.amount,category:"쇼핑",date:dateKey()})}save();openWait();return}
 if(b.dataset.settle){if(new Date().getDay()!==0||s.lastSettlement===dateKey())return;const left=Math.max(0,s.weekBudget+s.rollover-s.weekSpent),mode=b.dataset.settle,deposit=mode==="goal"?left:mode==="split"?Math.floor(left/2):0,carry=mode==="carry"?left:mode==="split"?left-deposit:0;s.goal=Math.min(TARGET,s.goal+deposit);if(deposit)s.goalEntries.push({amount:deposit,date:dateKey(),source:"settlement"});s.settlements.push({date:dateKey(),remaining:left,mode,deposit,carry});s.rollover=carry;s.weekSpent=0;s.lastSettlement=dateKey();save();shut();return}
});
(function initDrag(){const room=$("roomStage");let active=null;room.querySelectorAll("[data-decor]").forEach(el=>{el.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0||!s.placed[el.dataset.decor])return;active={el,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId)});el.addEventListener("pointermove",e=>{if(!active||active.el!==el||active.id!==e.pointerId)return;if(Math.hypot(e.clientX-active.x,e.clientY-active.y)>5)active.moved=true;if(!active.moved)return;el.classList.add("dragging");const r=room.getBoundingClientRect(),x=Math.max(9,Math.min(91,(e.clientX-r.left)/r.width*100)),y=Math.max(16,Math.min(91,(e.clientY-r.top)/r.height*100));el.style.left=x+"%";el.style.top=y+"%";el.style.transform="translate(-50%,-50%)";s.decorPositions[el.dataset.decor]={x,y}});const end=e=>{if(!active||active.el!==el||active.id!==e.pointerId)return;el.classList.remove("dragging");if(active.moved)save();active=null};el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end)})})();
window.addEventListener("storage",e=>{if(e.key===KEY){s=load();render()}});render();
</script></body></html>
