const initial={saved:0,weekBudget:140000,weekSpent:0,monthBudget:600000,monthSpent:0,goal:0,target:3000000,waitDone:false,pay:[false,false,false],reward:false,placed:{plant:true,lamp:true,rug:true},rollover:0,decorPositions:{},expenses:[]};let s;try{s=JSON.parse(localStorage.getItem("keepy")||"null")||structuredClone(initial)}catch(_){s=structuredClone(initial)};const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};const $=id=>document.getElementById(id),won=n=>"₩"+Math.round(n).toLocaleString("ko-KR");function save(){localStorage.setItem("keepy",JSON.stringify(s));render()}function modal(h){$("modalBody").innerHTML=h;$("modal").classList.add("on")}function shut(){$("modal").classList.remove("on")}function render(){s.placed ||= {plant:true,lamp:true,rug:true};s.pay ||= [false,false,false];s.expenses ||= [];s.waitItems ||= [];s.decorPositions ||= {};s.expenses ||= [];s.waitItems ||= [];document.querySelectorAll("[data-decor]").forEach(el=>el.classList.toggle("off",!s.placed[el.dataset.decor]));document.querySelectorAll("[data-item]").forEach(el=>el.classList.toggle("unplaced",!s.placed[el.dataset.item]));document.querySelectorAll("[data-decor]").forEach(el=>{let p=s.decorPositions[el.dataset.decor];if(p){el.style.left=p.x+"%";el.style.top=p.y+"%";el.style.right="auto";el.style.bottom="auto";el.style.transform="translate(-50%,-50%)"}});let w=Math.max(0,s.weekBudget+(s.rollover||0)-s.weekSpent),m=Math.max(0,s.monthBudget-s.monthSpent),g=s.goal/Math.max(1,s.target)*100;$("saved").textContent=won(s.saved);if($("waitQuick"))$("waitQuick").textContent=won(s.waitItems.filter(x=>x.status==="waiting").reduce((a,x)=>a+x.amount,0))+" 대기 중";if($("payQuick"))$("payQuick").textContent=(s.pay||[]).filter(Boolean).length+" / 3 완료";if($("collectQuick"))$("collectQuick").textContent=(3+(s.reward?1:0))+"개 획득";if($("reportQuick"))$("reportQuick").textContent=won(s.saved)+" 지킴";$("weekBudgetAmount").textContent=won(s.weekBudget+(s.rollover||0));$("weekLeft").textContent=won(w);$("weekUsed").textContent=won(s.weekSpent)+" 사용";$("monthLeft").textContent=won(m);$("monthUsed").textContent=won(s.monthSpent)+" 사용";$("weekBar").style.width=Math.min(100,w/(Math.max(1,s.weekBudget+(s.rollover||0)))*100)+"%";$("monthBar").style.width=Math.min(100,s.monthSpent/Math.max(1,s.monthBudget)*100)+"%";$("goal").textContent=won(s.goal);$("goalBar").style.width=Math.min(100,g)+"%";$("goalMeta").textContent=Math.floor(g)+"% · "+won(s.target-s.goal)+" 남음";$("reward").textContent=s.reward?"✨ Cozy Chair 획득!":won(Math.max(0,1800000-s.goal))+" 더 모으면 Cozy Chair";$("roomTalk").innerHTML=s.weekSpent>s.weekBudget?"조금 쉬어가도 괜찮아! 🌱":"이번 주도<br>잘 해보자! 🌱";$("mood").textContent=s.weekSpent>s.weekBudget?"이번 주는 조금 쉬어가자 🥺":s.weekSpent>s.weekBudget*.8?"예산을 한번 확인해볼까? 😳":"이번 주 좋은 페이스야! 😊"}render();

const info={plant:["🪴 Tiny Monstera","2026.09.12 · TOKYO 목표 30%"],lamp:["💡 Cozy Lamp","2026.09.28 · 지켜낸 돈 ₩150,000"],rug:["🧶 Soft Rug","2026.10.02 · WAIT LIST 성공"]};document.addEventListener("click",e=>{let k=e.target.closest("[data-item]")?.dataset.item;if(k){let d=info[k];modal("<h2>"+d[0]+"</h2><p>"+d[1]+"</p><button class='primary' data-place='"+k+"'>"+(s.placed[k]?"방에서 빼기":"방에 놓기")+"</button>")}if(e.target.dataset.place){let k=e.target.dataset.place;s.placed[k]=!s.placed[k];save();shut()}if(e.target.id==="expenseSave"){let n=+($("amt").value.replace(/\D/g,""));if(Number.isFinite(n)&&n>0&&n<=100000000){s.weekSpent+=n;s.monthSpent+=n;s.expenses.push({amount:n,category:$("cat").value,date:localDate()});save();shut()}}if(e.target.id==="goalSave"){let n=+($("gamt").value.replace(/\D/g,""));if(!Number.isFinite(n)||n<=0||n>100000000){alert("올바른 금액을 입력해 줘.");return}s.goal=Math.min(s.target,s.goal+n);if(s.goal>=1800000)s.reward=true;save();shut()}if(e.target.dataset.set){if(new Date().getDay()!==0)return;if(s.lastSettlement===localDate())return;let l=Math.max(0,s.weekBudget+(s.rollover||0)-s.weekSpent);if(e.target.dataset.set==="goal"){s.saved+=l;s.goal=Math.min(s.target,s.goal+l);s.rollover=0}if(e.target.dataset.set==="carry")s.rollover=l;if(e.target.dataset.set==="split"){s.saved+=Math.floor(l/2);s.goal=Math.min(s.target,s.goal+Math.floor(l/2));s.rollover=l-Math.floor(l/2)}s.weekSpent=0;s.lastSettlement=localDate();if(s.goal>=1800000)s.reward=true;save();shut()}if(e.target.dataset.pay!==undefined){let i=+e.target.dataset.pay;s.pay ||= [false,false,false];s.pay[i]=!s.pay[i];save();openPay()}});
function openWait(){modal('<h2>WAIT LIST 🛍️</h2>'+(s.waitDone?'<div class="card">운동화 · 결정 완료 ✓</div>':'<div class="card"><b>운동화 · ₩129,000</b><p class="muted">72시간 경과를 가정한 테스트</p><button class="primary" data-wait="no">안 살래! 돈 지키기</button><button class="secondary" data-wait="yes">그래도 살래</button></div>'))}function openPay(){let a=["경조사 통장 · ₩100,000","고정비 통장 · ₩600,000","여행저축 · ₩200,000"];modal("<h2>PAYDAY ROUTINE 💵</h2>"+a.map((x,i)=>"<div class=row><span>"+x+"</span><button class=chip data-pay="+i+">"+(s.pay[i]?"✓ 완료":"체크")+"</button></div>").join(""))}function collect(){modal('<h2>COLLECTION 🎁</h2><div class="grid"><button class="card" data-item="plant">🪴 Monstera</button><button class="card" data-item="lamp">💡 Lamp</button><button class="card" data-item="rug">🧶 Rug</button>'+(s.reward?'<div class="card">🪑 Cozy Chair</div>':'')+'</div>')}function report(){modal("<h2>October Report 📊</h2><div class=row><span>지켜낸 돈</span><b>"+won(s.saved)+"</b></div><div class=row><span>이번 달 지출</span><b>"+won(s.monthSpent)+"</b></div><div class=row><span>TOKYO 저축</span><b>"+won(s.goal)+"</b></div><div class=row><span>PAYDAY 완료</span><b>"+s.pay.filter(Boolean).length+"/3</b></div>")}document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>({wait:openWait,pay:openPay,collect,report}[b.dataset.more])());if($("reset"))$("reset").onclick=()=>{if(confirm("저장한 기록을 모두 초기화할까?")){s=structuredClone(initial);localStorage.removeItem("keepy");save()}};

/* Pointer-driven furniture placement, persisted separately from ownership. */
(function(){
 const stage=document.getElementById("roomStage");
 if(!stage)return;
 let active=null;
 stage.querySelectorAll("[data-decor]").forEach(el=>{
  el.addEventListener("pointerdown",e=>{
   if(e.pointerType==="mouse"&&e.button!==0 || !s.placed[el.dataset.decor])return;
   active={el,id:e.pointerId,startedX:e.clientX,startedY:e.clientY,moved:false};
   el.setPointerCapture(e.pointerId);el.classList.add("dragging");
  });
  el.addEventListener("pointermove",e=>{
   if(!active || active.el!==el || active.id!==e.pointerId)return;
   if(Math.hypot(e.clientX-active.startedX,e.clientY-active.startedY)>5)active.moved=true;
   if(!active.moved)return;
   const r=stage.getBoundingClientRect();
   const x=Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100));
   const y=Math.max(18,Math.min(91,(e.clientY-r.top)/r.height*100));
   el.style.left=x+"%";el.style.top=y+"%";el.style.right="auto";el.style.bottom="auto";el.style.transform="translate(-50%,-50%)";
   s.decorPositions[el.dataset.decor]={x,y};
  });
  const finish=e=>{
   if(!active || active.el!==el || active.id!==e.pointerId)return;
   el.classList.remove("dragging");
   if(active.moved)save();
   active=null;
  };
  el.addEventListener("pointerup",finish);
  el.addEventListener("pointercancel",finish);
 });
})();

/* Full app feature layer: real calendar, editable wait list, saved transaction history. */
(function(){
 const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
 const today=new Date();
 let shownMonth=new Date(today.getFullYear(),today.getMonth(),1);
 const esc=v=>String(v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
 function refreshCalendar(){
  const box=$("days");if(!box)return;
  const y=shownMonth.getFullYear(),m=shownMonth.getMonth();
  const first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();
  const entries=s.expenses||[];
  const totals={};entries.forEach(x=>{totals[x.date]=(totals[x.date]||0)+x.amount});
  box.innerHTML=Array(first).fill('<span></span>').join("")+Array.from({length:count},(_,i)=>{
   const d=i+1,key=dateKey(new Date(y,m,d)),v=totals[key]||0;
   return '<button class="day '+(key===dateKey(today)?"today ":"")+(v?"has-expense":"")+'" data-date="'+key+'">'+d+'<span>'+(v?"🪙":"·")+'</span></button>';
  }).join("");
  const title=document.querySelector("#calendar .title");if(title)title.textContent=y+"년 "+(m+1)+"월 기록";const monthLabel=$("calendarMonth");if(monthLabel)monthLabel.textContent=y+"."+(m+1);
  box.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{
   const k=b.dataset.date,items=entries.filter(x=>x.date===k);
   modal('<h2>'+k+' 지출</h2>'+(items.length?items.map(x=>'<div class="row"><span>'+esc(x.category)+'</span><b>'+won(x.amount)+'</b></div>').join("")+'<div class="report-stat"><b>합계</b><strong>'+won(items.reduce((a,x)=>a+x.amount,0))+'</strong></div>':'<div class="empty-state">이날 기록한 지출이 없어 🌱</div>'));
  });
 }
 const cal=document.querySelector("#calendar .card");
 if(cal){const bar=document.createElement("div");bar.style.cssText="display:flex;align-items:center;justify-content:space-between;gap:12px";
 bar.innerHTML='<button class="chip" id="prevMonth" aria-label="이전 달">‹</button><b id="calendarMonth"></b><button class="chip" id="nextMonth" aria-label="다음 달">›</button>';
 cal.prepend(bar);
 const weekdays=document.createElement("div");weekdays.className="calendar-header";weekdays.innerHTML=["일","월","화","수","목","금","토"].map(x=>"<span>"+x+"</span>").join("");bar.after(weekdays);
 $("prevMonth").onclick=()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()-1,1);refreshCalendar();};
 $("nextMonth").onclick=()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()+1,1);refreshCalendar();};
 }
 const originalRender=render;
 render=function(){originalRender();refreshCalendar();if($("calendarMonth"))$("calendarMonth").textContent=shownMonth.getFullYear()+"."+(shownMonth.getMonth()+1);};
 const originalWait=openWait;
 openWait=function(){
  s.waitItems ||= [];
  const items=s.waitItems.filter(x=>x.status==="waiting");
  modal('<h2>WAIT LIST 🛍️</h2><p class="muted">72시간 기다린 뒤 다시 결정해 봐.</p>'+
   (items.length?items.map(x=>{
    const elapsed=Date.now()-x.createdAt,ready=elapsed>=72*3600000,hrs=Math.ceil((72*3600000-elapsed)/3600000);
    return '<div class="card"><b>'+esc(x.name)+'</b><div class="row"><span>'+won(x.amount)+'</span><span class="muted">'+(ready?"결정할 시간 ✓":Math.max(1,hrs)+"시간 남음")+'</span></div>'+
     (ready?'<button class="primary" data-wait-id="'+x.id+'" data-wait-action="no">안 살래! 돈 지키기</button><button class="secondary" data-wait-id="'+x.id+'" data-wait-action="yes">구매하기</button>':'<p class="muted">기다리는 중 🌱</p>')+'</div>';
   }).join(""):'<div class="empty-state">대기 중인 물건이 없어!</div>')+
   '<button class="secondary" id="addWait">＋ 고민 중인 물건 추가</button>');
 };
 const originalReport=report;
 report=function(){
  const items=s.expenses||[];
  const monthly=items.filter(x=>x.date.startsWith(dateKey(new Date()).slice(0,7)));
  const total=monthly.reduce((a,x)=>a+x.amount,0);
  const cats={};monthly.forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);
  modal('<h2>REPORT 📊</h2><div class="report-stat"><span>이번 달 지켜낸 돈</span><strong>'+won(s.saved)+'</strong></div>'+
   '<div class="report-stat"><span>이번 달 기록된 지출</span><strong>'+won(total)+'</strong></div>'+
   '<div class="report-stat"><span>월간 예산 잔액</span><strong>'+won(Math.max(0,s.monthBudget-s.monthSpent))+'</strong></div>'+
   '<h3>카테고리별 기록</h3>'+(Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="row"><span>'+esc(k)+'</span><b>'+won(v)+'</b></div>').join(""):'<p class="muted">아직 직접 입력한 지출이 없어.</p>')+
   '<p class="muted">지출 기록은 이 기기에 저장돼.</p>');
 };
 document.addEventListener("click",e=>{
  if(e.target.id==="addWait"){
   modal('<h2>WAIT LIST에 추가</h2><label>물건 이름<input id="waitName" class="input" placeholder="예: 새 운동화" maxlength="60"></label><label>가격<input id="waitAmount" class="input" inputmode="numeric" placeholder="예: 129000"></label><button class="primary" id="saveWait">72시간 기다리기</button>');
  }
  if(e.target.id==="saveWait"){
   const name=$("waitName").value.trim(),amount=Number($("waitAmount").value.replace(/\D/g,""));
   if(!name||!Number.isFinite(amount)||amount<=0||amount>100000000){alert("물건 이름과 가격을 입력해 줘.");return}
   s.waitItems ||= [];s.waitItems.push({id:Date.now()+Math.floor(Math.random()*1000),name,amount,createdAt:Date.now(),status:"waiting"});save();openWait();
  }
  if(e.target.dataset.waitId){
   const item=(s.waitItems||[]).find(x=>String(x.id)===e.target.dataset.waitId);
   if(!item||item.status!=="waiting"||Date.now()-item.createdAt<72*3600000)return;
   item.status=e.target.dataset.waitAction==="no"?"saved":"bought";
   if(item.status==="saved")s.saved+=item.amount;else {s.weekSpent+=item.amount;s.monthSpent+=item.amount;s.expenses.push({amount:item.amount,category:"쇼핑",date:localDate()})}
   save();openWait();
  }
 });
 document.querySelectorAll('[data-nav="calendar"]').forEach(b=>b.addEventListener("click",refreshCalendar));
 refreshCalendar();
})();
</script><script id="keepy-reliability">
(function(){
 const KEY='keepy';
 window.addEventListener('storage',e=>{if(e.key===KEY)location.reload()});
 const modal=document.querySelector('.modal');
 if(modal){modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.remove('on')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('on')})}
 document.querySelectorAll('button').forEach(b=>{if(!b.getAttribute('type'))b.type='button'});
 const room=document.getElementById('roomStage');
 if(room)room.setAttribute('aria-label','가구를 드래그해서 꾸밀 수 있는 KEEPY 방');
})();
</script></body></html>
