const initial={saved:184000,weekBudget:140000,weekSpent:58000,monthBudget:600000,monthSpent:238400,goal:1620000,target:3000000,waitDone:false,pay:[false,false,false],reward:false};let s=JSON.parse(localStorage.getItem("keepy")||"null")||structuredClone(initial);const $=id=>document.getElementById(id),won=n=>"₩"+Math.round(n).toLocaleString("ko-KR");function save(){localStorage.setItem("keepy",JSON.stringify(s));render()}function modal(h){$("modalBody").innerHTML=h;$("modal").classList.add("on")}function shut(){$("modal").classList.remove("on")}function render(){let w=Math.max(0,s.weekBudget-s.weekSpent),m=Math.max(0,s.monthBudget-s.monthSpent),g=s.goal/s.target*100;$("saved").textContent=won(s.saved);$("weekLeft").textContent=won(w)+" LEFT";$("weekUsed").textContent=won(s.weekSpent)+" 사용";$("monthLeft").textContent=won(m)+" LEFT";$("monthUsed").textContent=won(s.monthSpent)+" 사용";$("weekBar").style.width=Math.min(100,s.weekSpent/s.weekBudget*100)+"%";$("monthBar").style.width=Math.min(100,s.monthSpent/s.monthBudget*100)+"%";$("goal").textContent=won(s.goal);$("goalBar").style.width=Math.min(100,g)+"%";$("goalMeta").textContent=Math.floor(g)+"% · "+won(s.target-s.goal)+" 남음";$("reward").textContent=s.reward?"✨ Cozy Chair 획득!":won(Math.max(0,1800000-s.goal))+" 더 모으면 Cozy Chair";$("mood").textContent=s.weekSpent>s.weekBudget?"이번 주는 조금 쉬어가자 🥺":s.weekSpent>s.weekBudget*.8?"예산을 한번 확인해볼까? 😳":"이번 주 좋은 페이스야! 😊"}render();

const info={plant:["🪴 Tiny Monstera","2026.09.12 · TOKYO 목표 30%"],lamp:["💡 Cozy Lamp","2026.09.28 · 지켜낸 돈 ₩150,000"],tokyo:["🗼 Tokyo Mini","2026.10.02 · WAIT LIST 성공"]};document.addEventListener("click",e=>{let k=e.target.closest("[data-item]")?.dataset.item;if(k){let d=info[k];modal("<h2>"+d[0]+"</h2><p>"+d[1]+"</p><button class='primary' onclick='shut()'>방에 놓기</button>")}if(e.target.id==="expenseSave"){let n=+($("amt").value.replace(/\D/g,""));if(n){s.weekSpent+=n;s.monthSpent+=n;save();shut()}}if(e.target.id==="goalSave"){let n=+($("gamt").value.replace(/\D/g,""));s.goal=Math.min(s.target,s.goal+n);if(s.goal>=1800000)s.reward=true;save();shut()}if(e.target.dataset.set){let l=Math.max(0,s.weekBudget-s.weekSpent);s.saved+=l;if(e.target.dataset.set==="goal")s.goal+=l;if(e.target.dataset.set==="split")s.goal+=Math.floor(l/2);s.weekSpent=0;if(s.goal>=1800000)s.reward=true;save();shut()}if(e.target.dataset.wait){if(!s.waitDone&&e.target.dataset.wait==="no")s.saved+=129000;s.waitDone=true;save();shut()}if(e.target.dataset.pay!==undefined){let i=+e.target.dataset.pay;s.pay[i]=!s.pay[i];save();openPay()}});
function openWait(){modal('<h2>WAIT LIST 🛍️</h2>'+(s.waitDone?'<div class="card">운동화 · 결정 완료 ✓</div>':'<div class="card"><b>운동화 · ₩129,000</b><p class="muted">72시간 경과를 가정한 테스트</p><button class="primary" data-wait="no">안 살래! 돈 지키기</button><button class="secondary" data-wait="yes">그래도 살래</button></div>'))}function openPay(){let a=["경조사 통장 · ₩100,000","고정비 통장 · ₩600,000","여행저축 · ₩200,000"];modal("<h2>PAYDAY ROUTINE 💵</h2>"+a.map((x,i)=>"<div class=row><span>"+x+"</span><button class=chip data-pay="+i+">"+(s.pay[i]?"✓ 완료":"체크")+"</button></div>").join(""))}function collect(){modal('<h2>COLLECTION 🎁</h2><div class="grid"><button class="card" data-item="plant">🪴 Monstera</button><button class="card" data-item="lamp">💡 Lamp</button><button class="card" data-item="tokyo">🗼 Tokyo</button>'+(s.reward?'<div class="card">🪑 Cozy Chair</div>':'')+'</div>')}function report(){modal("<h2>October Report 📊</h2><div class=row><span>지켜낸 돈</span><b>"+won(s.saved)+"</b></div><div class=row><span>이번 달 지출</span><b>"+won(s.monthSpent)+"</b></div><div class=row><span>TOKYO 저축</span><b>"+won(s.goal)+"</b></div><div class=row><span>PAYDAY 완료</span><b>"+s.pay.filter(Boolean).length+"/3</b></div>")}document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>({wait:openWait,pay:openPay,collect,report}[b.dataset.more])());$("reset").onclick=()=>{s=structuredClone(initial);localStorage.removeItem("keepy");save()};let moods=["😉","🙂","🙂","😳","😉","🙂","😊","😉","🥺","🙂","😉","😊","🙂","😳","😉","🙂","😭","🙂","😉","😊","😉"];$("days").innerHTML=moods.map((m,i)=>'<button class="day" data-day="'+(i+1)+'">'+(i+1)+'<span>'+m+'</span></button>').join("");document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>modal("<h2>10월 "+b.dataset.day+"일</h2><div class=card><b>식비 ₩8,000</b><p class=muted>날짜별 지출 상세 테스트</p></div>"));
</script></body></html>
