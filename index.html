<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEEPY</title><style>
*{box-sizing:border-box}body{margin:0;background:#F7F1E7;color:#3c332f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding:20px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.chip,button{border:0;cursor:pointer}.chip{background:#fff;padding:9px 12px;border-radius:99px}.card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 6px 20px #725b4510}.hero{margin-top:14px}.saved{text-align:center}.saved small{color:#93867d}.saved strong{display:block;font-size:34px;color:#e27f82;margin:3px}.room{height:300px;border-radius:25px;margin-top:14px;position:relative;overflow:hidden;background:linear-gradient(#dceee4 0 68%,#e8d6bd 68%)}.room-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%}.window{position:absolute;left:24px;top:25px;width:82px;height:75px;background:#c4e5f1;border:7px solid #fff;border-radius:12px}.rug{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:220px;height:60px;border-radius:50%;background:#f4c6bc}.plant{position:absolute;right:30px;bottom:32px;font-size:45px}.pig{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);width:126px;height:138px}.head{position:absolute;left:18px;top:0;width:92px;height:82px;border-radius:48% 48% 44% 44%;background:radial-gradient(circle at 35% 25%,#ffe9e6,#efb2b0 75%);box-shadow:inset -8px -9px 15px #d9939340,0 8px 15px #7b555520}.ear{position:absolute;width:31px;height:38px;background:#efb2b0;top:-10px;border-radius:70% 30% 55% 45%}.ear.l{left:12px;transform:rotate(-25deg)}.ear.r{right:12px;transform:rotate(25deg)}.sprout{position:absolute;top:-27px;left:45px;font-size:29px}.eye{position:absolute;top:34px;width:7px;height:9px;background:#403434;border-radius:50%}.eye.l{left:28px}.eye.r{right:28px}.snout{position:absolute;left:32px;top:49px;width:31px;height:22px;border-radius:50%;background:#e99b9d}.body{position:absolute;left:26px;top:70px;width:76px;height:62px;border-radius:46%;background:linear-gradient(135deg,#ffd9d5,#eaa8a8);box-shadow:inset -7px -7px 12px #d18b8b35}.leg{position:absolute;bottom:0;width:24px;height:35px;border-radius:15px;background:#efb2b0}.leg.l{left:34px}.leg.r{right:34px}.arm{position:absolute;top:78px;width:20px;height:48px;border-radius:14px;background:#efb2b0}.arm.l{left:12px;transform:rotate(12deg)}.arm.r{right:12px;transform:rotate(-12deg)}.mood{z-index:3;position:absolute;left:12px;bottom:9px;background:#ffffffdd;border-radius:99px;padding:7px 10px;font-size:11px}.items{z-index:3;position:absolute;right:9px;top:9px;display:grid;gap:7px}.item{width:42px;height:42px;border-radius:14px;background:#fff;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.big{font-size:19px;font-weight:900}.muted{font-size:12px;color:#92857d}.progress{height:8px;background:#eee6df;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;background:#e9a09e}.event{margin-top:11px;background:#fff0c7;border-radius:22px;padding:15px}.primary,.secondary{width:100%;padding:13px;border-radius:15px;font-weight:800}.primary{background:#e89092;color:#fff}.secondary{background:#eee5de;margin-top:8px}.screen{display:none}.screen.active{display:block}.title{font-size:26px;font-weight:900;margin:15px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:#fff;border-radius:13px;min-height:60px}.day span{display:block;font-size:20px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu button{text-align:left;min-height:100px}.home-actions{margin-top:11px}.quick{text-align:left;border:0;min-height:112px}.quick span,.quick strong{display:block}.quick span{font-size:12px;color:#92857d;margin:9px 0 5px}.quick strong{font-size:14px;color:#4b4039}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #eee2d8;padding:7px 6px max(10px,env(safe-area-inset-bottom))}.nav button{background:none;color:#756a64;font-weight:700}.nav button.on{color:#db7478}.nav .plus{margin:auto;width:50px;height:50px;border-radius:50%;background:#e99b9e;color:#fff;font-size:28px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:40;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:min(480px,100%);background:#fffaf4;border-radius:28px 28px 0 0;padding:22px;max-height:85vh;overflow:auto}.x{float:right;width:35px;height:35px;border-radius:50%;background:#eee5de}.input{width:100%;padding:13px;margin:6px 0 10px;border:1px solid #e5d9d0;border-radius:13px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee4dc}
.lamp{position:absolute;left:26px;bottom:45px;font-size:43px}.decor.off{display:none}.room-stage{background:linear-gradient(145deg,#f4e6dc 0 62%,#dfcbb9 62%)}.room-stage .pig{filter:drop-shadow(0 9px 8px #8a65604d)}.item.unplaced{opacity:.45}</style></head><body><main class="app">
<section id="home" class="screen active"><div class="top"><div class="logo">KEEPY 🌱</div><button class="chip" id="reset">샘플 초기화</button></div><div class="card hero"><div class="saved"><small>이번 달 내가 지켜낸 돈</small><strong id="saved"></strong><small>미래의 나에게 남겨둔 돈 ✨</small></div><div class="room room-stage"><div class="window"></div><div class="rug decor" data-decor="rug"></div><div class="plant decor" data-decor="plant">🪴</div><div class="lamp decor" data-decor="lamp">💡</div><div class="pig"><div class="head"><div class="ear l"></div><div class="ear r"></div><div class="sprout">🌱</div><div class="eye l"></div><div class="eye r"></div><div class="snout"></div></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div><div id="mood" class="mood"></div><div class="items"><button class="item" data-item="plant">🪴</button><button class="item" data-item="lamp">💡</button><button class="item" data-item="rug">🧶</button></div></div></div><div class="grid"><div class="card"><b>THIS WEEK</b><div id="weekLeft" class="big"></div><div id="weekUsed" class="muted"></div><div class="progress"><div id="weekBar" class="bar"></div></div></div><div class="card"><b>THIS MONTH</b><div id="monthLeft" class="big"></div><div id="monthUsed" class="muted"></div><div class="progress"><div id="monthBar" class="bar"></div></div></div></div><div class="event"><b>🐷 일요일 이벤트</b><p class="muted">이번 주 남은 돈을 어디로 보낼지 골라봐.</p><small>이월금은 저축 실적과 별도로 계산해.</small><button id="settle" class="primary">이번 주 정산하기</button></div>
<div class="grid home-actions"><button class="card quick" data-more="wait"><b>🛍️ WAIT LIST</b><span>72시간 뒤 다시 생각하기</span><strong>₩129,000 대기 중</strong></button><button class="card quick" data-more="pay"><b>💵 PAYDAY</b><span>월급날 루틴</span><strong>1 / 3 완료</strong></button><button class="card quick" data-more="collect"><b>🎁 COLLECTION</b><span>내가 모은 방 아이템</span><strong>3개 획득</strong></button><button class="card quick" data-more="report"><b>📊 REPORT</b><span>이번 달 기록 보기</span><strong>₩184,000 지킴</strong></button></div></section>
<section id="calendar" class="screen"><div class="title">Mood Calendar</div><div class="card"><div id="days" class="calendar"></div></div><p class="muted">날짜를 누르면 그날의 지출 상세가 열려.</p></section>
<section id="goals" class="screen"><div class="title">Goals 🎯</div><div class="card"><b>✈️ TOKYO</b><div class="big"><span id="goal"></span> / ₩3,000,000</div><div class="progress"><div id="goalBar" class="bar"></div></div><p id="goalMeta" class="muted"></p><button id="goalAdd" class="primary">목표에 돈 보내기</button></div><div class="card" style="margin-top:10px"><b>🎁 다음 아이템</b><p id="reward"></p></div></section>
<section id="more" class="screen"><div class="title">More</div><div class="menu"><button class="card" data-more="wait"><b>🛍️ WAIT LIST</b><p class="muted">72시간 충동구매 보류</p></button><button class="card" data-more="pay"><b>💵 PAYDAY</b><p class="muted">월급날 배분 체크</p></button><button class="card" data-more="collect"><b>🎁 COLLECTION</b><p class="muted">획득한 방 아이템</p></button><button class="card" data-more="report"><b>📊 REPORT</b><p class="muted">이번 달 기록</p></button></div></section></main>
<nav class="nav"><button class="on" data-nav="home">🐷<br>HOME</button><button data-nav="calendar">📅<br>CALENDAR</button><button id="plus" class="plus">＋</button><button data-nav="goals">🎯<br>GOALS</button><button data-nav="more">•••<br>MORE</button></nav>
<div id="modal" class="modal"><div class="sheet"><button id="close" class="x">×</button><div id="modalBody"></div></div></div>
<script>
const initial={saved:184000,weekBudget:140000,weekSpent:58000,monthBudget:600000,monthSpent:238400,goal:1620000,target:3000000,waitDone:false,pay:[false,false,false],reward:false,placed:{plant:true,lamp:true,rug:true},rollover:0};let s=JSON.parse(localStorage.getItem("keepy")||"null")||structuredClone(initial);const $=id=>document.getElementById(id),won=n=>"₩"+Math.round(n).toLocaleString("ko-KR");function save(){localStorage.setItem("keepy",JSON.stringify(s));render()}function modal(h){$("modalBody").innerHTML=h;$("modal").classList.add("on")}function shut(){$("modal").classList.remove("on")}function render(){s.placed ||= {plant:true,lamp:true,rug:true};document.querySelectorAll("[data-decor]").forEach(el=>el.classList.toggle("off",!s.placed[el.dataset.decor]));document.querySelectorAll("[data-item]").forEach(el=>el.classList.toggle("unplaced",!s.placed[el.dataset.item]));let w=Math.max(0,s.weekBudget+(s.rollover||0)-s.weekSpent),m=Math.max(0,s.monthBudget-s.monthSpent),g=s.goal/s.target*100;$("saved").textContent=won(s.saved);$("weekLeft").textContent=won(w)+" LEFT";$("weekUsed").textContent=won(s.weekSpent)+" 사용";$("monthLeft").textContent=won(m)+" LEFT";$("monthUsed").textContent=won(s.monthSpent)+" 사용";$("weekBar").style.width=Math.min(100,s.weekSpent/s.weekBudget*100)+"%";$("monthBar").style.width=Math.min(100,s.monthSpent/s.monthBudget*100)+"%";$("goal").textContent=won(s.goal);$("goalBar").style.width=Math.min(100,g)+"%";$("goalMeta").textContent=Math.floor(g)+"% · "+won(s.target-s.goal)+" 남음";$("reward").textContent=s.reward?"✨ Cozy Chair 획득!":won(Math.max(0,1800000-s.goal))+" 더 모으면 Cozy Chair";$("mood").textContent=s.weekSpent>s.weekBudget?"이번 주는 조금 쉬어가자 🥺":s.weekSpent>s.weekBudget*.8?"예산을 한번 확인해볼까? 😳":"이번 주 좋은 페이스야! 😊"}render();
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(b.dataset.nav).classList.add("active");document.querySelectorAll("[data-nav]").forEach(x=>x.classList.remove("on"));b.classList.add("on")});$("close").onclick=shut;$("modal").onclick=e=>{if(e.target===$("modal"))shut()};$("plus").onclick=()=>modal('<h2>지출 기록</h2><input id="amt" class="input" value="12000" inputmode="numeric"><select id="cat" class="input"><option>식비</option><option>카페</option><option>쇼핑</option><option>교통</option></select><button id="expenseSave" class="primary">기록하기</button>');$("goalAdd").onclick=()=>modal('<h2>TOKYO에 돈 보내기</h2><input id="gamt" class="input" value="200000" inputmode="numeric"><button id="goalSave" class="primary">보내기</button>');$("settle").onclick=()=>{let l=Math.max(0,s.weekBudget+(s.rollover||0)-s.weekSpent);modal('<h2>이번 주 '+won(l)+'을 지켰어! 🎉</h2><button class="primary" data-set="goal">🎯 전부 TOKYO로</button><button class="secondary" data-set="carry">➡️ 다음 주로</button><button class="secondary" data-set="split">✂️ 반반 나누기</button>')};
const info={plant:["🪴 Tiny Monstera","2026.09.12 · TOKYO 목표 30%"],lamp:["💡 Cozy Lamp","2026.09.28 · 지켜낸 돈 ₩150,000"],rug:["🧶 Soft Rug","2026.10.02 · WAIT LIST 성공"]};document.addEventListener("click",e=>{let k=e.target.closest("[data-item]")?.dataset.item;if(k){let d=info[k];modal("<h2>"+d[0]+"</h2><p>"+d[1]+"</p><button class='primary' onclick='shut()'>방에 놓기</button>")}if(e.target.dataset.place){let k=e.target.dataset.place;s.placed[k]=!s.placed[k];save();shut()}if(e.target.id==="expenseSave"){let n=+($("amt").value.replace(/\D/g,""));if(n){s.weekSpent+=n;s.monthSpent+=n;save();shut()}}if(e.target.id==="goalSave"){let n=+($("gamt").value.replace(/\D/g,""));s.goal=Math.min(s.target,s.goal+n);if(s.goal>=1800000)s.reward=true;save();shut()}if(e.target.dataset.set){let l=Math.max(0,s.weekBudget+(s.rollover||0)-s.weekSpent);if(e.target.dataset.set==="goal"){s.saved+=l;s.goal+=l;s.rollover=0}if(e.target.dataset.set==="carry")s.rollover=l;if(e.target.dataset.set==="split"){s.saved+=Math.floor(l/2);s.goal+=Math.floor(l/2);s.rollover=l-Math.floor(l/2)}s.weekSpent=0;if(s.goal>=1800000)s.reward=true;save();shut()}if(e.target.dataset.wait){if(!s.waitDone&&e.target.dataset.wait==="no")s.saved+=129000;s.waitDone=true;save();shut()}if(e.target.dataset.pay!==undefined){let i=+e.target.dataset.pay;s.pay[i]=!s.pay[i];save();openPay()}});
function openWait(){modal('<h2>WAIT LIST 🛍️</h2>'+(s.waitDone?'<div class="card">운동화 · 결정 완료 ✓</div>':'<div class="card"><b>운동화 · ₩129,000</b><p class="muted">72시간 경과를 가정한 테스트</p><button class="primary" data-wait="no">안 살래! 돈 지키기</button><button class="secondary" data-wait="yes">그래도 살래</button></div>'))}function openPay(){let a=["경조사 통장 · ₩100,000","고정비 통장 · ₩600,000","여행저축 · ₩200,000"];modal("<h2>PAYDAY ROUTINE 💵</h2>"+a.map((x,i)=>"<div class=row><span>"+x+"</span><button class=chip data-pay="+i+">"+(s.pay[i]?"✓ 완료":"체크")+"</button></div>").join(""))}function collect(){modal('<h2>COLLECTION 🎁</h2><div class="grid"><button class="card" data-item="plant">🪴 Monstera</button><button class="card" data-item="lamp">💡 Lamp</button><button class="card" data-item="rug">🧶 Rug</button>'+(s.reward?'<div class="card">🪑 Cozy Chair</div>':'')+'</div>')}function report(){modal("<h2>October Report 📊</h2><div class=row><span>지켜낸 돈</span><b>"+won(s.saved)+"</b></div><div class=row><span>이번 달 지출</span><b>"+won(s.monthSpent)+"</b></div><div class=row><span>TOKYO 저축</span><b>"+won(s.goal)+"</b></div><div class=row><span>PAYDAY 완료</span><b>"+s.pay.filter(Boolean).length+"/3</b></div>")}document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>({wait:openWait,pay:openPay,collect,report}[b.dataset.more])());$("reset").onclick=()=>{s=structuredClone(initial);localStorage.removeItem("keepy");save()};let moods=["😉","🙂","🙂","😳","😉","🙂","😊","😉","🥺","🙂","😉","😊","🙂","😳","😉","🙂","😭","🙂","😉","😊","😉"];$("days").innerHTML=moods.map((m,i)=>'<button class="day" data-day="'+(i+1)+'">'+(i+1)+'<span>'+m+'</span></button>').join("");document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>modal("<h2>10월 "+b.dataset.day+"일</h2><div class=card><b>식비 ₩8,000</b><p class=muted>날짜별 지출 상세 테스트</p></div>"));
</script></body></html>
